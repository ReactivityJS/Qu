<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QU Framework</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <main>
    <h1>QU Framework</h1>
    <p class="lede">Ein kleines, ereignisgetriebenes, Zero-Trust-Framework für lokale und verteilte Anwendungen. Vanilla JavaScript, keine Laufzeit-Abhängigkeiten.</p>

    <!-- Client-seitiger Hash-Router über drei Kategorien (portal.mjs) —
         #/services, #/examples, #/documentation, dieselbe Pfad-Konvention
         wie jede App in diesem Repo (src/ui/hash-router.js). Auch OHNE
         Hash direkt per Pfad erreichbar (/dev/services, /dev/examples,
         /dev/documentation — server/portal-routes.mjs liefert dafür einfach
         diese Seite aus, portal.mjs wählt dann anhand von
         location.pathname dieselbe Kategorie als Startansicht). Diese Seite
         selbst lebt unter /dev/ — "/" gehört der QUniverse-Shell (siehe
         root index.js's createRootContentRoutes()), außer QUniverse ist
         per QU_SERVE_QUNIVERSE=0 deaktiviert, dann liefert dieselbe Route
         genau diese Datei auch unter "/" aus. -->
    <nav class="category-tabs" id="category-tabs">
      <button class="category-tab" data-category="services" type="button">🚀 Services</button>
      <button class="category-tab" data-category="examples" type="button">🧪 Examples</button>
      <button class="category-tab" data-category="documentation" type="button">📖 Dokumentation</button>
      <!-- Standardmäßig versteckt (`hidden`) — portal.mjs blendet diesen
           Tab nur ein, wenn die LOKAL gespeicherte Identität dieses
           Browsers zufällig ein per QU_RELAY_ADMINS gepinnter Fingerprint
           ist (GET /relay/info liefert die Admin-Liste, ein Fingerprint
           ist in diesem Framework nie geheim). Reine Sichtbarkeits-/
           Komfort-Entscheidung, KEINE Sicherheitsgrenze — die eigentliche
           Durchsetzung bleibt vollständig die Relay-seitige ACL-Prüfung
           beim Schreiben (relay/relay.mjs); wer die URL kennt, kann
           /examples/relay-admin/index.html jederzeit direkt öffnen. -->
      <button class="category-tab" data-category="admin" type="button" hidden>🛠️ Admin</button>
    </nav>

    <!-- Karteninhalte werden von portal.mjs aus GET /relay/services befüllt
         (server/service-registry.mjs) — nicht mehr hartcodiert, siehe
         portal.mjs's Kommentar. Services: eigenständige, tatsächlich
         nutzbare Apps. Examples: kurze, fokussierte Code-Module. Documentation:
         alles zum Nachlesen. Admin: nur für erkannte Admin-Identitäten (s.o.). -->
    <section class="cards-section" data-category="services">
      <nav class="cards"></nav>
    </section>

    <section class="cards-section" data-category="examples">
      <nav class="cards"></nav>
    </section>

    <section class="cards-section" data-category="documentation">
      <nav class="cards"></nav>
    </section>

    <section class="cards-section" data-category="admin">
      <nav class="cards"></nav>
    </section>
  </main>
  <script type="module" src="/dev/portal.mjs"></script>
</body>
</html>
